info:
  name: category-comparison
  type: http
  seq: 4
  tags:
http:
  method: GET
  url: '{{base_url}}/api/v1/categories/{{category_id}}/comparison?period=this_month'
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", () => expect(res.status).to.equal(200));
        test("Has category detail schema", () => {
          expect(res.body.data).to.have.property("category_id");
          expect(res.body.data).to.have.property("current");
          expect(res.body.data).to.have.property("previous");
        });
