info:
  name: Get Transactions
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/transactions?page=1&limit=10"
  auth:
    type: bearer
    token: "{{token}}"

tests: |
  test("Status is 200", () => {
    expect(res.status).to.equal(200);
  });
  test("Has pagination", () => {
    expect(res.body).to.have.property("page");
  });

examples:
  - name: Success
    status: 200
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 200,
        "message": "Transactions fetched successfully",
        "data": [
          {
            "id": "tx-001",
            "category_id": "cat-001-food",
            "amount": 25000,
            "date": "2026-09-15T00:00:00.000Z",
            "created_at": "2026-09-15T08:00:00.000Z",
            "category": {
              "name": "Food",
              "color": "#FF7043",
              "icon": "restaurant"
            }
          },
          {
            "id": "tx-002",
            "category_id": "cat-002-transport",
            "amount": 15000,
            "date": "2026-09-14T00:00:00.000Z",
            "created_at": "2026-09-14T09:30:00.000Z",
            "category": {
              "name": "Transport",
              "color": "#42A5F5",
              "icon": "directions_car"
            }
          }
        ],
        "page": 1,
        "limit": 10,
        "total": 2,
        "total_pages": 1,
        "has_next": false
      }

  - name: Empty result
    status: 200
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 200,
        "message": "Transactions fetched successfully",
        "data": [],
        "page": 1,
        "limit": 10,
        "total": 0,
        "total_pages": 0,
        "has_next": false
      }
