info:
  name: Create Transaction
  type: http
  seq: 2
http:
  method: POST
  url: "{{base_url}}/api/v1/transactions"
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |
      {
        "type": "expense",
        "category_id": "{{category_id}}",
        "amount": 25000,
        "date": "2026-09-15T08:30:00.000Z",
        "note": "Lunch"
      }

postScript: |
  if (res.status === 201) {
    bru.setVar("transaction_id", res.body.data.id);
  }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 201", () => {
          expect(res.status).to.equal(201);
        });
