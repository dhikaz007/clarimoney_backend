info:
  name: Create Transaction
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/transactions"
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |
      {
        "category_id": "{{category_id}}",
        "amount": 25000,
        "date": "2026-09-15T00:00:00.000Z"
      }

postScript: |
  if (res.status === 201) {
    bru.setVar("transaction_id", res.body.data.id);
  }

tests: |
  test("Status is 201", () => {
    expect(res.status).to.equal(201);
  });

examples:
  - name: Success
    status: 201
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 201,
        "message": "Transaction created successfully",
        "data": {
          "id": "tx-new-001"
        }
      }

  - name: Invalid category
    status: 400
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 400,
        "message": "Invalid category"
      }

  - name: Missing required fields
    status: 400
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 400,
        "message": "category_id, amount, and date required"
      }

  - name: Invalid date format
    status: 400
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 400,
        "message": "Invalid date format"
      }
