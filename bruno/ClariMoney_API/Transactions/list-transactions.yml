info:
  name: List Transactions
  type: http
  seq: 1
http:
  method: GET
  url: "{{base_url}}/api/v1/transactions?page=1&limit=10&type=all&period=this_month&search="
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", () => { expect(res.status).to.equal(200); });
        test("Returns array", () => { expect(res.body.data).to.be.an("array"); });
