info:
  name: Old Refresh Token Rejected
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/refresh"
  auth:
    type: none
  body:
    type: json
    data: |
      {
        "refresh_token": "{{previous_refresh_token}}"
      }

tests: |
  test("Old refresh token is rejected", () => {
    expect(res.status).to.equal(401);
  });

examples:
  - name: Unauthorized
    status: 401
    body: |
      {"status_code": 401, "message": "Invalid refresh token"}
