info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/login"
  body:
    type: json
    data: |
      {
        "email": "test@example.com",
        "password": "password123",
        "device_id": "{{device_id}}",
        "device_name": "{{device_name}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status == 200) {
          const data = res.body.data;
          
           bru.setEnvVar("token", data.token);
          bru.setEnvVar("access_token", data.access_token);
          bru.setEnvVar("refresh_token", data.refresh_token);
          bru.setEnvVar("session_id", data.session_id);
          bru.setEnvVar("user_id", data.user.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Success
  - name: Invalid credentials
