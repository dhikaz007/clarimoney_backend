info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/login"
  auth:
    type: none
  body:
    type: json
    data: |
      {
        "email": "test@example.com",
        "password": "password123",
        "device_id": "{{device_id}}",
        "device_name": "{{device_name}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 200) {
          bru.setEnvVar("access_token", res.body.data.access_token);
          bru.setEnvVar("token", res.body.data.access_token);
          bru.setEnvVar("refresh_token", res.body.data.refresh_token);
          bru.setEnvVar("session_id", res.body.data.session_id);
          bru.setEnvVar("user_id", res.body.data.user.id);
        }

tests: |
  test("Status is 200", () => {
    expect(res.status).to.equal(200);
  });
  test("Returns token", () => {
    expect(res.body.data.access_token).to.be.a("string");
    expect(res.body.data.refresh_token).to.be.a("string");
    expect(res.body.data.session_id).to.be.a("string");
  });

examples:
  - name: Success
    status: 200
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 200,
        "message": "Login successful",
        "data": {
          "user": {
            "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "email": "test@example.com"
          },
          "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhMWIyYzNkNC1lNWY2LTc4OTAtYWJjZC1lZjEyMzQ1Njc4OTAiLCJpYXQiOjE2OTQwMDAwMDAsImV4cCI6MTY5NDYwNDgwMH0.XYZ123..."
        }
      }

  - name: Invalid credentials
    status: 401
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 401,
        "message": "Invalid email or password"
      }
