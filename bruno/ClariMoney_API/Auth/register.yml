info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/register"
  auth:
    type: none
  body:
    type: json
    data: |
      {
        "email": "test@example.com",
        "password": "password123",
        "device_id": "{{device_id}}",
        "device_name": "{{device_name}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 201) {
          bru.setEnvVar("access_token", res.body.data.access_token);
          bru.setEnvVar("token", res.body.data.access_token);
          bru.setEnvVar("refresh_token", res.body.data.refresh_token);
          bru.setEnvVar("session_id", res.body.data.session_id);
          bru.setEnvVar("user_id", res.body.data.user.id);
        }

    - type: tests
      code: |-
        test("Status is 201", () => {
          expect(res.status).to.equal(201);
        });
        test("Returns session tokens", () => {
          expect(res.body.data.access_token).to.be.a("string");
          expect(res.body.data.refresh_token).to.be.a("string");
          expect(res.body.data.session_id).to.be.a("string");
        });
        
examples:
  - name: Success
    status: 201
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 201,
        "message": "Registration successful",
        "data": {
          "user": {
            "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "email": "test@example.com"
          },
          "access_token": "access-token-example",
          "refresh_token": "refresh-token-example",
          "session_id": "session-001",
          "token": "access-token-example"
        }
      }

  - name: Email already registered
    status: 409
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 409,
        "message": "Email already registered"
      }

  - name: Invalid email
    status: 400
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 400,
        "message": "Valid email and password of at least 8 characters required"
      }
