info:
  name: Resend Verification
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/resend-verification"
  auth:
    type: bearer
    token: "{{access_token}}"

tests: |
  test("Request succeeds", () => {
    expect(res.status).to.equal(200);
  });
  test("Does not expose token", () => {
    expect(JSON.stringify(res.body)).to.not.include("token");
  });

examples:
  - name: Success or already verified
    status: 200
    body: |
      {"status_code": 200, "message": "If email is unverified, verification instructions were sent", "data": null}
  - name: SMTP unavailable
    status: 500
    body: |
      {"status_code": 500, "message": "Verification email unavailable", "data": null}
  - name: Missing access token
    status: 401
    body: |
      {"status_code": 401, "message": "Missing or invalid token", "data": null}
