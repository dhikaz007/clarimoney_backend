info:
  name: Me
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data) {
          bru.setEnvVar("email_verified", String(res.body.data.email_verified));
        }

tests: |
  test("Status is 200", () => {
    expect(res.status).to.equal(200);
  });
  test("Returns profile state", () => {
    expect(res.body.data).to.have.keys("id", "email", "email_verified");
  });

examples:
  - name: Success
    status: 200
    body: |
      {
        "status_code": 200,
        "message": "Profile fetched successfully",
        "data": {"id": "user-uuid", "email": "user@example.com", "email_verified": false}
      }
  - name: Missing access token
    status: 401
    body: |
      {"status_code": 401, "message": "Missing or invalid token", "data": null}
