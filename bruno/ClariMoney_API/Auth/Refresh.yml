info:
  name: Refresh Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/refresh"
  auth:
    type: none
  body:
    type: json
    data: |
      {
        "refresh_token": "{{refresh_token}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 200) {
          bru.setEnvVar("previous_refresh_token", bru.getEnvVar("refresh_token"));
          bru.setEnvVar("access_token", res.body.data.access_token);
          bru.setEnvVar("token", res.body.data.access_token);
          bru.setEnvVar("refresh_token", res.body.data.refresh_token);
        }

tests: |
  test("Status is 200", () => {
    expect(res.status).to.equal(200);
  });
  test("Returns rotated tokens", () => {
    expect(res.body.data.access_token).to.be.a("string");
    expect(res.body.data.refresh_token).to.be.a("string");
  });

examples:
  - name: Success
    status: 200
    body: |
      {"status_code": 200, "message": "Token refreshed", "data": {"access_token": "access-token-refreshed", "refresh_token": "refresh-token-refreshed", "token": "access-token-refreshed"}}
