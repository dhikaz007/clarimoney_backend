info:
  name: Refresh Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/refresh"
  body:
    type: json
    data: |
      {
        "refresh_token": "{{refresh_token}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("previous_refresh_token", bru.getEnvVar("refresh_token"));
          bru.setEnvVar("access_token", res.body.data.access_token);
          bru.setEnvVar("token", res.body.data.access_token);
          bru.setEnvVar("refresh_token", res.body.data.refresh_token);
        }
    - type: tests
      code: |-
        test("Status is 200", () => {
            expect(res.status).to.equal(200);
          });
          test("Returns rotated tokens", () => {
            expect(res.body.data.access_token).to.be.a("string");
            expect(res.body.data.refresh_token).to.be.a("string");
          });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Success
