info:
  name: Forgot Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/forgot-password"
  body:
    type: json
    data: |
      {
        "email": "test@example.com"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Does not reveal account existence", () => {
          expect(res.status).to.equal(200);
          expect(res.body.message).to.equal("If an account exists, password reset instructions were sent");
        });
        test("Does not expose token", () => {
          expect(JSON.stringify(res.body)).to.not.include("token");
        });
        
examples:
  - name: Existing or unknown email
    status: 200
    body: |
      {"status_code": 200, "message": "If an account exists, password reset instructions were sent", "data": null}
  - name: Invalid input remains generic
    status: 200
    body: |
      {"status_code": 200, "message": "If an account exists, password reset instructions were sent", "data": null}
