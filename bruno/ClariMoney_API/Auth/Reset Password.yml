info:
  name: Reset Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/reset-password"
  body:
    type: json
    data: |
      {
        "token": "{{reset_token}}",
        "password": "newpassword123"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Password reset succeeds", () => {
          expect(res.status).to.equal(200);
        });
        test("Does not expose token", () => {
          expect(JSON.stringify(res.body)).to.not.include("token");
        });
        
examples:
  - name: Success
    status: 200
    body: |
      {"status_code": 200, "message": "Password reset successfully", "data": null}
  - name: Invalid, expired, reused, or weak request
    status: 400
    body: |
      {"status_code": 400, "message": "Invalid or expired password reset request", "data": null}
