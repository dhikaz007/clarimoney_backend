info:
  name: Verify Email
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/verify-email"
  body:
    type: json
    data: |
      {
        "token": "{{verification_token}}"
      }

tests: |
  test("Verification succeeds", () => {
    expect(res.status).to.equal(200);
  });
  test("Reports verification state only", () => {
    expect(res.body.data.email_verified).to.equal(true);
  });

examples:
  - name: Success
    status: 200
    body: |
      {"status_code": 200, "message": "Email verified successfully", "data": {"email_verified": true}}
  - name: Invalid, expired, or reused token
    status: 400
    body: |
      {"status_code": 400, "message": "Invalid or expired verification token", "data": null}
