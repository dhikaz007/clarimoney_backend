info:
  name: Logout All Devices
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/logout"
  auth:
    type: bearer
    token: "{{token}}"

tests: |
  test("Status is 200", () => {
    expect(res.status).to.equal(200);
  });

examples:
  - name: Success
    status: 200
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 200,
        "message": "Logged out from all devices",
        "data": null
      }
