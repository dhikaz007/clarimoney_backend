info:
  name: Overview
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/summary/overview?period=this_month"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", () => {
          expect(res.status).to.equal(200);
        });
        test("Has total_expense", () => {
          expect(res.body.data).to.have.property("total_expense");
        });
        
examples:
  - name: Success
    status: 200
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 200,
        "message": "Summary fetched successfully",
        "data": {
          "total_expense": 250000,
          "period": "this_month",
          "summary": [
            {
              "category_id": "cat-001-food",
              "name": "Food",
              "color": "#FF7043",
              "icon": "restaurant",
              "total": 150000,
              "percentage": 60
            },
            {
              "category_id": "cat-002-transport",
              "name": "Transport",
              "color": "#42A5F5",
              "icon": "directions_car",
              "total": 75000,
              "percentage": 30
            },
            {
              "category_id": "cat-003-subscriptions",
              "name": "Subscriptions",
              "color": "#7E57C2",
              "icon": "subscriptions",
              "total": 25000,
              "percentage": 10
            }
          ],
          "largest_category": {
            "category_id": "cat-001-food",
            "name": "Food",
            "total": 150000,
            "percentage": 60
          }
        }
      }

  - name: Invalid period
    status: 400
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 400,
        "message": "period must be this_month or previous_month"
      }

  - name: No transactions
    status: 200
    headers:
      content-type: application/json
    body: |
      {
        "status_code": 200,
        "message": "Summary fetched successfully",
        "data": {
          "total_expense": 0,
          "period": "this_month",
          "summary": [],
          "largest_category": null
        }
      }
