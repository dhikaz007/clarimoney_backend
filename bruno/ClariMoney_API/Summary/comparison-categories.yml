info:
  name: comparison-categories
  type: http
  seq: 3
  tags:
http:
  method: GET
  url: '{{base_url}}/api/v1/summary/comparison/categories?period=this_month'
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", () => expect(res.status).to.equal(200));
        test("Has category array schema", () => {
          expect(res.body.data.categories).to.be.an("array");
          expect(res.body.data).to.have.property("periods");
        });
