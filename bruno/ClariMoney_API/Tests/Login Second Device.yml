info:
  name: Login Second Device
  type: http
  seq: 12

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/login"
  auth:
    type: none
  body:
    type: json
    data: |
      {
        "email": "test@example.com",
        "password": "password123",
        "device_id": "{{device_id}}-second",
        "device_name": "{{device_name}} Second"
      }

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 200) {
          bru.setEnvVar("access_token_2", res.body.data.access_token);
          bru.setEnvVar("refresh_token_2", res.body.data.refresh_token);
          bru.setEnvVar("session_id_2", res.body.data.session_id);
        }

    - type: tests
      code: |-
        test("Second-device login succeeds", () => {
          expect(res.status).to.equal(200);
        });
        test("Returns second session state", () => {
          expect(res.body.data.session_id).to.be.a("string");
          expect(res.body.data.refresh_token).to.be.a("string");
        });
        
examples:
  - name: Success
    status: 200
    body: |
      {
        "status_code": 200,
        "message": "Login successful",
        "data": {
          "user": {"id": "user-001", "email": "test@example.com"},
          "access_token": "access-token-second",
          "refresh_token": "refresh-token-second",
          "session_id": "session-002",
          "token": "access-token-second"
        }
      }
