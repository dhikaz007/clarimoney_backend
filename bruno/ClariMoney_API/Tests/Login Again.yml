info:
  name: Login Again
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/login"
  auth:
    type: none
  body:
    type: json
    data: |
      {
        "email": "test@example.com",
        "password": "password123",
        "device_id": "{{device_id}}",
        "device_name": "{{device_name}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 200) {
          bru.setEnvVar("access_token", res.body.data.access_token);
          bru.setEnvVar("token", res.body.data.access_token);
          bru.setEnvVar("refresh_token", res.body.data.refresh_token);
          bru.setEnvVar("session_id", res.body.data.session_id);
          bru.setEnvVar("user_id", res.body.data.user.id);
        }

    - type: tests
      code: |-
        test("Login succeeds", () => {
          expect(res.status).to.equal(200);
        });
        test("Persists fresh session state", () => {
          expect(res.body.data.session_id).to.be.a("string");
          expect(res.body.data.refresh_token).to.be.a("string");
        });
        
examples:
  - name: Success
    status: 200
    body: |
      {"status_code": 200, "message": "Login successful", "data": {"user": {"id": "user-001", "email": "test@example.com"}, "access_token": "access-token-again", "refresh_token": "refresh-token-again", "session_id": "session-003", "token": "access-token-again"}}
